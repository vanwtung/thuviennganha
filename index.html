<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thư viện kỷ niệm</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500&family=Cormorant+Garamond:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#03020a; --ink:#eae6ff; --muted:#a6a9d8; --gold:#f0d79a;
    --panel:rgba(16,11,44,.62); --line:rgba(190,178,255,.28);
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#03020a; --ink:#eae6ff; } }
  :root[data-theme="dark"]{ --bg:#03020a; --ink:#eae6ff; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
    font-family:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-tap-highlight-color:transparent}
  canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}

  .top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 18px) 22px 0;pointer-events:none}
  .top h1{margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;font-size:clamp(22px,3.6vw,34px);
    letter-spacing:.06em;color:var(--gold);text-shadow:0 0 24px rgba(150,120,255,.55)}
  .top p{margin:2px 0 0;font-size:12px;font-weight:300;color:var(--muted);letter-spacing:.02em}

  .hint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 86px);transform:translateX(-50%);
    text-align:center;pointer-events:none;font-size:14px;font-weight:300;letter-spacing:.03em;color:var(--ink);
    padding:10px 20px;border:1px solid var(--line);border-radius:999px;background:var(--panel);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);max-width:calc(100vw - 32px);
    transition:opacity .9s ease;opacity:0}
  .hint.on{opacity:1;animation:breathe 3.2s ease-in-out infinite}
  .hint.static.on{animation:none}
  @keyframes breathe{50%{box-shadow:0 0 28px rgba(140,110,255,.5)}}

  .bar{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);
    display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 24px);
    opacity:0;pointer-events:none;transition:opacity .8s ease}
  .bar.on{opacity:1;pointer-events:auto}
  .bar button,#lb button{font:inherit;font-size:13px;color:var(--ink);background:var(--panel);border:1px solid var(--line);
    padding:10px 16px;border-radius:999px;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    transition:background .2s,border-color .2s}
  .bar button:hover{background:rgba(70,50,160,.55);border-color:rgba(210,200,255,.6)}
  .bar button[aria-pressed="false"]{opacity:.65}
  .bar button:focus-visible,#lb button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

  #tip{position:fixed;left:0;top:0;pointer-events:none;font-size:12px;padding:6px 11px;border-radius:8px;
    background:rgba(10,7,30,.82);border:1px solid var(--line);color:var(--ink);opacity:0;transition:opacity .15s;
    white-space:nowrap;z-index:5}
  #flash{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:6;
    background:radial-gradient(circle at 50% 50%,#fff 0%,#dcd0ff 30%,#7a5cff 75%,#2a1a7a 100%)}

  #lb{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:rgba(3,2,10,.84);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    opacity:0;pointer-events:none;transition:opacity .35s ease;padding:24px}
  #lb.on{opacity:1;pointer-events:auto}
  #lb img{max-width:min(92vw,520px);max-height:68vh;border-radius:14px;box-shadow:0 0 80px rgba(130,100,255,.55);
    transform:scale(.88);transition:transform .45s cubic-bezier(.2,.9,.3,1.2)}
  #lb.on img{transform:scale(1)}
  #lb h2{margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-size:30px;color:var(--gold);font-weight:700;text-align:center}
  #lb p{margin:0;font-size:13px;color:var(--muted);text-align:center}

  .lbrow{display:flex;gap:8px}
  #lbName{font-family:'Cormorant Garamond',Georgia,serif;font-size:28px;font-weight:700;color:var(--gold);text-align:center;
    width:min(90vw,420px);padding:6px 14px;border-radius:12px;border:1px solid var(--gold);background:var(--panel);outline:none}
  #lbName[hidden]{display:none}
  #lbT{cursor:text}
  #lb #lbDel{border-color:rgba(255,140,160,.45)}

  @media (prefers-reduced-motion: reduce){ .hint.on{animation:none} }
  #meteor{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}

  /* ============ đăng ký / đăng nhập ============ */
  #auth{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;overflow:auto;
    padding:calc(env(safe-area-inset-top,0px) + 20px) 16px calc(env(safe-area-inset-bottom,0px) + 20px);
    background:rgba(3,2,10,.72);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    opacity:0;pointer-events:none;transition:opacity .35s ease}
  #auth.on{opacity:1;pointer-events:auto}
  #auth.checking .acard{visibility:hidden}
  .acard{position:relative;width:min(100%,400px);margin:auto;padding:30px 26px 24px;border-radius:22px;
    background:linear-gradient(160deg,rgba(28,19,78,.92),rgba(10,7,32,.94));border:1px solid var(--line);
    box-shadow:0 0 70px rgba(120,90,255,.35),inset 0 0 0 1px rgba(246,226,164,.08)}
  .abrand{text-align:center;color:var(--gold);font-size:22px;letter-spacing:.4em;margin-bottom:2px;text-shadow:0 0 18px rgba(150,120,255,.8)}
  .acard h2{margin:0;text-align:center;font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;font-size:30px;color:var(--gold);letter-spacing:.03em}
  .asub{margin:4px 0 18px;text-align:center;font-size:12.5px;font-weight:300;color:var(--muted);line-height:1.5}
  .aclose{position:absolute;right:12px;top:10px;width:34px;height:34px;padding:0;border-radius:50%;font:inherit;font-size:20px;line-height:1;
    color:var(--muted);background:transparent;border:1px solid transparent;cursor:pointer}
  .aclose:hover{color:var(--ink);border-color:var(--line)}
  .aclose[hidden]{display:none}
  .atabs{display:flex;gap:4px;padding:4px;margin-bottom:16px;border-radius:999px;background:rgba(0,0,0,.28);border:1px solid var(--line)}
  .atabs[hidden]{display:none}
  .atabs button{flex:1;font:inherit;font-size:13px;color:var(--muted);background:transparent;border:0;padding:9px 10px;border-radius:999px;cursor:pointer;transition:background .2s,color .2s}
  .atabs button[aria-selected="true"]{background:rgba(120,90,255,.45);color:var(--ink)}
  #auth form[hidden]{display:none}
  .fld{margin-bottom:12px}
  .fld label{display:block;font-size:12px;font-weight:400;color:var(--muted);margin:0 0 5px 2px}
  .fld input[type=text],.fld input[type=password]{width:100%;font:inherit;font-size:15px;color:var(--ink);padding:11px 14px;border-radius:12px;
    background:rgba(0,0,0,.32);border:1px solid var(--line);outline:none;transition:border-color .2s,box-shadow .2s}
  .fld input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(240,215,154,.15)}
  .fld input[aria-invalid="true"]{border-color:rgba(255,130,150,.8)}
  .fld small{display:block;margin:4px 2px 0;font-size:11px;color:var(--muted);font-weight:300}
  .pw{position:relative}
  .pw input{padding-right:62px!important}
  .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);font:inherit;font-size:12px;color:var(--muted);background:transparent;border:0;padding:6px 9px;border-radius:8px;cursor:pointer}
  .eye:hover{color:var(--gold)}
  .meter{display:flex;gap:4px;margin-top:6px}
  .meter i{flex:1;height:4px;border-radius:2px;background:rgba(190,178,255,.18);transition:background .25s}
  .chk{display:flex;align-items:center;gap:8px;margin:2px 0 12px;font-size:12.5px;color:var(--muted);cursor:pointer}
  .chk input{accent-color:#a58bff;width:16px;height:16px;margin:0}
  .amsg{min-height:20px;margin:0 0 10px;font-size:12.5px;line-height:1.45;color:#ff9db0}
  .amsg.ok{color:#9be8c0}
  .abtn{width:100%;font:inherit;font-size:15px;font-weight:500;color:#1a1030;padding:12px 16px;border-radius:999px;border:0;cursor:pointer;
    background:linear-gradient(135deg,#f8e6ab,#d9a93f);box-shadow:0 0 28px rgba(240,200,110,.35);transition:transform .15s,opacity .2s}
  .abtn:hover{transform:translateY(-1px)}
  .abtn:disabled{opacity:.55;cursor:not-allowed;transform:none}
  #auth .alink:focus-visible,#auth button:focus-visible,#acct button:focus-visible,#auth input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .alink{font:inherit;font-size:12.5px;color:var(--gold);background:transparent;border:0;padding:0;margin-left:2px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
  .alink:hover{color:#fff}
  .anote{margin:14px 0 0;text-align:center;font-size:11px;font-weight:300;color:var(--muted);line-height:1.5}

  #acct{position:fixed;right:calc(env(safe-area-inset-right,0px) + 16px);top:calc(env(safe-area-inset-top,0px) + 16px);z-index:8;
    display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 32px);font-size:12px;color:var(--muted)}
  #acct[hidden]{display:none}
  #acctName{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-right:4px;color:var(--ink)}
  #acct button{font:inherit;font-size:12px;color:var(--ink);background:var(--panel);border:1px solid var(--line);padding:7px 12px;border-radius:999px;cursor:pointer;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:background .2s,border-color .2s}
  #acct button:hover{background:rgba(70,50,160,.55);border-color:rgba(210,200,255,.6)}
  @media (max-width:560px){#acct{top:calc(env(safe-area-inset-top,0px) + 74px)}}
  @media (prefers-reduced-motion: reduce){#auth{transition:none}}
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="Kệ sách và thiên hà tương tác"></canvas>
<canvas id="meteor" aria-hidden="true"></canvas>

<div class="top">
  <h1 id="ttl">Thư viện của tôi</h1>
  <p id="sub">chọn một cuốn sách để mở</p>
</div>

<div class="hint" id="hint"></div>

<div class="bar" id="shelfBar"></div>
<div class="bar" id="bar">
  <button id="bAuto" aria-pressed="true">Tự xoay: bật</button>
  <button id="bAdd">Thêm ảnh vào sách này</button>
  <button id="bBack">Về kệ sách</button>
</div>
<input type="file" id="file" accept="image/*" multiple hidden>

<div id="tip"></div>
<div id="flash"></div>

<div id="lb" role="dialog" aria-modal="true" aria-label="Xem ảnh">
  <img id="lbImg" alt="">
  <h2 id="lbT" title="Bấm để đổi tên"></h2>
  <input id="lbName" maxlength="40" aria-label="Tên ảnh" autocomplete="off" hidden>
  <p id="lbS"></p>
  <div class="lbrow"><button id="lbRen">Đặt tên</button><button id="lbX">Đóng</button><button id="lbDel">Xóa ảnh</button></div>
</div>


<div id="acct" hidden>
  <span id="acctName"></span>
  <button type="button" id="acctPw">Đổi mật khẩu</button>
  <button type="button" id="acctOut">Đăng xuất</button>
</div>

<div id="auth" class="on checking" role="dialog" aria-modal="true" aria-labelledby="aTitle">
  <div class="acard">
    <button type="button" class="aclose" id="aClose" aria-label="Đóng" hidden>×</button>
    <div class="abrand" aria-hidden="true">✦ ✦ ✦</div>
    <h2 id="aTitle">Thư viện kỷ niệm</h2>
    <p class="asub" id="aSub"></p>

    <div class="atabs" id="aTabs" role="tablist">
      <button type="button" role="tab" data-v="login" aria-selected="true">Đăng nhập</button>
      <button type="button" role="tab" data-v="register" aria-selected="false">Đăng ký</button>
    </div>

    <form id="fLogin" novalidate>
      <div class="fld"><label for="lgUser">Tên đăng nhập</label>
        <input id="lgUser" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="20"></div>
      <div class="fld"><label for="lgPass">Mật khẩu</label>
        <div class="pw"><input id="lgPass" type="password" autocomplete="current-password" maxlength="128">
        <button type="button" class="eye" data-eye="lgPass">Hiện</button></div></div>
      <label class="chk"><input type="checkbox" id="lgRem" checked> Ghi nhớ đăng nhập trên thiết bị này</label>
      <p class="amsg" id="lgMsg" role="alert"></p>
      <button class="abtn" type="submit">Đăng nhập</button>
    </form>

    <form id="fReg" novalidate hidden>
      <div class="fld"><label for="rgName">Tên hiển thị <span style="opacity:.6">(tuỳ chọn)</span></label>
        <input id="rgName" type="text" autocomplete="nickname" maxlength="30"></div>
      <div class="fld"><label for="rgUser">Tên đăng nhập</label>
        <input id="rgUser" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="20">
        <small>3–20 ký tự: chữ thường, số, dấu chấm hoặc gạch dưới; bắt đầu bằng chữ hoặc số</small></div>
      <div class="fld"><label for="rgPass">Mật khẩu</label>
        <div class="pw"><input id="rgPass" type="password" autocomplete="new-password" maxlength="128">
        <button type="button" class="eye" data-eye="rgPass">Hiện</button></div>
        <div class="meter" id="rgMeter" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
        <small id="rgHint">Ít nhất 8 ký tự, gồm cả chữ và số</small></div>
      <div class="fld"><label for="rgPass2">Nhập lại mật khẩu</label>
        <div class="pw"><input id="rgPass2" type="password" autocomplete="new-password" maxlength="128">
        <button type="button" class="eye" data-eye="rgPass2">Hiện</button></div></div>
      <p class="amsg" id="rgMsg" role="alert"></p>
      <button class="abtn" type="submit">Tạo tài khoản</button>
    </form>

    <form id="fPw" novalidate hidden>
      <div class="fld"><label for="cpOld">Mật khẩu hiện tại</label>
        <div class="pw"><input id="cpOld" type="password" autocomplete="current-password" maxlength="128">
        <button type="button" class="eye" data-eye="cpOld">Hiện</button></div></div>
      <div class="fld"><label for="cpNew">Mật khẩu mới</label>
        <div class="pw"><input id="cpNew" type="password" autocomplete="new-password" maxlength="128">
        <button type="button" class="eye" data-eye="cpNew">Hiện</button></div>
        <small>Ít nhất 8 ký tự, gồm cả chữ và số</small></div>
      <div class="fld"><label for="cpNew2">Nhập lại mật khẩu mới</label>
        <div class="pw"><input id="cpNew2" type="password" autocomplete="new-password" maxlength="128">
        <button type="button" class="eye" data-eye="cpNew2">Hiện</button></div></div>
      <p class="amsg" id="cpMsg" role="alert"></p>
      <button class="abtn" type="submit">Cập nhật mật khẩu</button>
    </form>

    <p class="anote" id="aNote">Chưa đăng nhập thì chưa thể mở hay xem sách.</p>
  </div>
</div>

<script>
/* ============ hệ thống tài khoản ============
   - Mật khẩu không bao giờ được lưu: chỉ lưu muối + băm PBKDF2-SHA256.
   - Nơi lưu tài khoản tự chọn theo khả năng của trình duyệt: IndexedDB → localStorage → bộ nhớ tạm.
   - Chưa đăng nhập: TVAuth.ready chưa hoàn tất và toàn bộ trang bị khóa. */
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const enc=new TextEncoder();
const ITER=150000, ITER_JS=30000, MAX_TRY=5;
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
const unhex=h=>new Uint8Array(h.match(/../g).map(x=>parseInt(x,16)));
const rnd=n=>{const a=new Uint8Array(n);try{crypto.getRandomValues(a)}catch(e){for(let i=0;i<n;i++)a[i]=Math.floor(Math.random()*256)}return hex(a)};
const same=(a,b)=>{if(a.length!==b.length)return false;let d=0;for(let i=0;i<a.length;i++)d|=a.charCodeAt(i)^b.charCodeAt(i);return d===0};
const safe=n=>{try{return window[n]}catch(e){return null}};
const SUBTLE=(()=>{try{return !!(window.crypto&&crypto.subtle&&crypto.subtle.importKey)}catch(e){return false}})();

/* ---- SHA-256 / PBKDF2 bằng JS thuần (dự phòng khi trình duyệt không có crypto.subtle) ---- */
const K=new Uint32Array([0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);
function sha256b(msg){
  const l=msg.length,n=((l+9+63)>>6)<<6,buf=new Uint8Array(n);buf.set(msg);buf[l]=0x80;
  const dv=new DataView(buf.buffer);dv.setUint32(n-8,Math.floor(l/0x20000000));dv.setUint32(n-4,(l<<3)>>>0);
  let a0=0x6a09e667,b0=0xbb67ae85,c0=0x3c6ef372,d0=0xa54ff53a,e0=0x510e527f,f0=0x9b05688c,g0=0x1f83d9ab,h0=0x5be0cd19;
  const w=new Uint32Array(64);
  for(let o=0;o<n;o+=64){
    for(let i=0;i<16;i++)w[i]=dv.getUint32(o+i*4);
    for(let i=16;i<64;i++){
      const x=w[i-15],y=w[i-2];
      const s0=((x>>>7)|(x<<25))^((x>>>18)|(x<<14))^(x>>>3),s1=((y>>>17)|(y<<15))^((y>>>19)|(y<<13))^(y>>>10);
      w[i]=(w[i-16]+s0+w[i-7]+s1)|0;
    }
    let a=a0,b=b0,c=c0,d=d0,e=e0,f=f0,g=g0,h=h0;
    for(let i=0;i<64;i++){
      const S1=((e>>>6)|(e<<26))^((e>>>11)|(e<<21))^((e>>>25)|(e<<7)),ch=(e&f)^(~e&g);
      const t1=(h+S1+ch+K[i]+w[i])|0;
      const S0=((a>>>2)|(a<<30))^((a>>>13)|(a<<19))^((a>>>22)|(a<<10)),mj=(a&b)^(a&c)^(b&c);
      const t2=(S0+mj)|0;
      h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0;
    }
    a0=(a0+a)|0;b0=(b0+b)|0;c0=(c0+c)|0;d0=(d0+d)|0;e0=(e0+e)|0;f0=(f0+f)|0;g0=(g0+g)|0;h0=(h0+h)|0;
  }
  const out=new Uint8Array(32),ov=new DataView(out.buffer);
  [a0,b0,c0,d0,e0,f0,g0,h0].forEach((v,i)=>ov.setUint32(i*4,v>>>0));
  return out;
}
function pbkdf2js(pw,salt,iter){
  let key=pw;if(key.length>64)key=sha256b(key);
  const ip=new Uint8Array(64).fill(0x36),op=new Uint8Array(64).fill(0x5c);
  for(let i=0;i<key.length;i++){ip[i]^=key[i];op[i]^=key[i]}
  const hmac=m=>{const a=new Uint8Array(64+m.length);a.set(ip);a.set(m,64);const ih=sha256b(a);const b=new Uint8Array(96);b.set(op);b.set(ih,64);return sha256b(b)};
  const s=new Uint8Array(salt.length+4);s.set(salt);s[s.length-1]=1;
  let u=hmac(s);const t=new Uint8Array(u);
  for(let i=1;i<iter;i++){u=hmac(u);for(let j=0;j<32;j++)t[j]^=u[j]}
  return t;
}
async function derive(pw,salt,iter){
  if(SUBTLE){
    try{
      const k=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);
      return hex(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:unhex(salt),iterations:iter},k,256));
    }catch(e){}
  }
  await new Promise(r=>setTimeout(r,20)); /* nhường luồng để nút kịp đổi chữ "Đang kiểm tra…" */
  return hex(pbkdf2js(enc.encode(pw),unhex(salt),iter));
}
const sha=async s=>{
  if(SUBTLE){try{return hex(await crypto.subtle.digest('SHA-256',enc.encode(s)))}catch(e){}}
  return hex(sha256b(enc.encode(s)));
};
const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r({code:'timeout',name:'timeout'}),ms))]);

/* ---- kho tài khoản: IndexedDB → localStorage → bộ nhớ tạm ---- */
let dbp=null,backend=null,cloudDb=null,READONLY=false;const mem=new Map();
const clone=o=>JSON.parse(JSON.stringify(o));
function db(){
  return dbp||(dbp=new Promise((res,rej)=>{
    try{
      const idb=safe('indexedDB');if(!idb)throw new Error('no-idb');
      const rq=idb.open('thu-vien-tai-khoan',1);
      rq.onupgradeneeded=()=>rq.result.createObjectStore('users',{keyPath:'key'});
      rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error);rq.onblocked=()=>rej(new Error('blocked'));
      setTimeout(()=>rej(new Error('timeout')),3000);
    }catch(e){rej(e)}
  }));
}
const tx=(mode,fn)=>db().then(d=>new Promise((res,rej)=>{
  const t=d.transaction('users',mode);let r;
  try{r=fn(t.objectStore('users'))}catch(e){rej(e);return}
  t.oncomplete=()=>res(r&&r.result);
  t.onerror=e=>rej((e.target&&e.target.error)||t.error);
  t.onabort=()=>rej(t.error||new Error('abort'));
}));
async function getCloud(){
  try{
    if(!window.claude||!claude.use)return null;
    const d=await withTimeout(claude.use('db'),3500);if(!d)return null;
    try{const u=await withTimeout(claude.use('user'),2000);if(u&&(await u.can('data.write'))===false)READONLY=true}catch(e){}
    return d;
  }catch(e){return null}
}
async function pickBackend(){
  if(backend)return backend;
  const c=await getCloud();if(c){cloudDb=c;backend='cloud';return backend}
  try{await db();backend='idb';return backend}catch(e){dbp=null}
  try{const ls=safe('localStorage');ls.setItem('tv-probe','1');ls.removeItem('tv-probe');backend='ls';return backend}catch(e){}
  backend='mem';return backend;
}
const LK='tv-user:';
const Users={
  async get(k){
    const b=await pickBackend();
    if(b==='cloud'){const sn=await cloudDb.collection('accounts').doc(k).get();return sn.exists?clone(sn.data()):undefined}
    if(b==='idb')return tx('readonly',s=>s.get(k));
    if(b==='ls'){const v=safe('localStorage').getItem(LK+k);return v?JSON.parse(v):undefined}
    return mem.get(k);
  },
  async put(rec){
    const b=await pickBackend();
    if(b==='cloud')return cloudDb.collection('accounts').doc(rec.key).set(clone(rec));
    if(b==='idb')return tx('readwrite',s=>s.put(rec));
    if(b==='ls')return safe('localStorage').setItem(LK+rec.key,JSON.stringify(rec));
    mem.set(rec.key,rec);
  },
  async add(rec){
    if(await Users.get(rec.key))throw{name:'ConstraintError'};
    return Users.put(rec);
  }
};

/* ---- chống đoán mật khẩu: khóa tạm sau mỗi 5 lần sai ---- */
const FK='tv-fail:',failMem={};
const getFail=k=>{try{return JSON.parse(safe('localStorage').getItem(FK+k))||failMem[k]||{n:0,until:0}}catch(e){return failMem[k]||{n:0,until:0}}};
const setFail=(k,s)=>{failMem[k]=s;try{safe('localStorage').setItem(FK+k,JSON.stringify(s))}catch(e){}};
const clearFail=k=>{delete failMem[k];try{safe('localStorage').removeItem(FK+k)}catch(e){}};

/* ---- phiên đăng nhập ---- */
const SK='tv-session';let memSess=null;
const readSess=()=>{for(const n of ['localStorage','sessionStorage']){try{const v=JSON.parse(safe(n).getItem(SK));if(v&&v.k&&v.t)return v}catch(e){}}return memSess};
const clearSess=()=>{memSess=null;for(const n of ['localStorage','sessionStorage']){try{safe(n).removeItem(SK)}catch(e){}}};
async function startSession(rec,remember){
  const token=rnd(32),th=await sha(token);
  rec.toks=[...(rec.toks||[]).slice(-4),th];
  await Users.put(rec);
  clearSess();
  const v=JSON.stringify({k:rec.key,t:token});let saved=false;
  try{safe(remember?'localStorage':'sessionStorage').setItem(SK,v);saved=true}catch(e){}
  if(!saved)memSess={k:rec.key,t:token};
  return{key:rec.key,name:rec.name};
}
async function restore(){
  const s=readSess();if(!s)return null;
  const rec=await Users.get(s.k);
  if(!rec||rec.disabled)return clearSess(),null;
  const th=await sha(s.t);
  if(!(rec.toks||[]).includes(th))return clearSess(),null;
  return{key:rec.key,name:rec.name};
}

/* ---- nghiệp vụ ---- */
const USER_RE=/^[a-z0-9][a-z0-9._]{2,19}$/;
function passProblem(pw,user){
  if(pw.length<8)return'Mật khẩu cần ít nhất 8 ký tự.';
  if(!/[A-Za-z]/.test(pw)||!/\d/.test(pw))return'Mật khẩu cần có cả chữ và số.';
  if(user&&pw.toLowerCase()===user)return'Mật khẩu không được trùng tên đăng nhập.';
  return'';
}
const OWNER_KEY='tung1207',OWNER_NAME='vawntung',OWNER_ITER=150000,OWNER_SALT='e64ee18c9f286dabff468eb0d92082e5',OWNER_HASH='b7ca3a8bf2af21dfb138f855c429b5cf56d819f3b4685c42e0ae175ca3180745',RESERVED=['tung1207','quantri','admin','administrator'];
async function register(name,user,pw){
  const key=user.trim().toLowerCase(),iter=SUBTLE?ITER:ITER_JS;
  if(RESERVED.includes(key))throw{code:'exists'};
  if(await Users.get(key))throw{code:'exists'};
  const salt=rnd(16),hash=await derive(pw,salt,iter);
  const rec={key,name:(name||'').trim()||key,salt,iter,hash,created:Date.now(),toks:[]};
  try{await Users.add(rec)}
  catch(e){if(e&&e.name==='ConstraintError')throw{code:'exists'};throw e}
}
async function login(user,pw,remember){
  const key=user.trim().toLowerCase(),st=getFail(key);
  if(st.until>Date.now())throw{code:'locked',wait:Math.ceil((st.until-Date.now())/1000)};
  const fx=key===OWNER_KEY;
  const rec=USER_RE.test(key)?((await Users.get(key))||(fx?{key,toks:[],created:Date.now()}:null)):null;
  if(!rec)throw{code:'nouser',key};
  if(rec.disabled)throw{code:'disabled'};
  const h=await derive(pw,fx?OWNER_SALT:rec.salt,fx?OWNER_ITER:rec.iter);
  if(!same(h,fx?OWNER_HASH:rec.hash)){
    st.n=(st.n||0)+1;
    if(st.n%MAX_TRY===0){
      const wait=Math.min(30*Math.pow(2,st.n/MAX_TRY-1),900);
      st.until=Date.now()+wait*1000;setFail(key,st);
      throw{code:'locked',wait};
    }
    setFail(key,st);throw{code:'bad',left:MAX_TRY-st.n%MAX_TRY};
  }
  clearFail(key);
  if(fx){rec.sys=true;rec.name=OWNER_NAME;rec.salt=OWNER_SALT;rec.iter=OWNER_ITER;rec.hash=OWNER_HASH;delete rec.disabled}
  return startSession(rec,remember);
}
async function changePassword(oldPw,newPw){
  const s=readSess();if(!s)throw{code:'nosess'};
  const rec=await Users.get(s.k);if(!rec)throw{code:'nosess'};
  const h=await derive(oldPw,rec.salt,rec.iter);
  if(!same(h,rec.hash))throw{code:'badold'};
  rec.iter=SUBTLE?ITER:ITER_JS;rec.salt=rnd(16);rec.hash=await derive(newPw,rec.salt,rec.iter);
  rec.toks=[await sha(s.t)]; /* đăng xuất mọi phiên khác */
  await Users.put(rec);
}
async function logout(){
  const s=readSess();
  try{
    if(s){const rec=await Users.get(s.k);
      if(rec){const th=await sha(s.t);rec.toks=(rec.toks||[]).filter(t=>t!==th);await Users.put(rec)}}
  }catch(e){}
  clearSess();location.reload();
}

function recolorGalaxy(th){
  const a=new THREE.Color(th.gal[0]),m=new THREE.Color(th.gal[1]),o=new THREE.Color(th.gal[2]),gl=new THREE.Color(th.glow),tmp=new THREE.Color();
  const ca=G.pts.geometry.attributes.color.array;
  for(let i=0;i<G.N;i++){

  G.bulge.geometry.attributes.color.needsUpdate=true;

async function enterGalaxy(){

canvas.addEventListener('pointerdown',e=>{

/* ============ tự lưu ảnh (IndexedDB, nằm ngay trên trình duyệt) ============ */
const Local=(()=>{
  let dbp=null;
  function open(){
    if(dbp)return dbp;
    dbp=new Promise((res,rej)=>{
      try{
        const rq=indexedDB.open('thu-vien-ky-niem',1);
        rq.onupgradeneeded=()=>rq.result.createObjectStore('photos',{keyPath:'id'});
        rq.onsuccess=()=>res(rq.result);
        rq.onerror=()=>rej(rq.error);
      }catch(e){rej(e)}
    });
    return dbp;
  }
  const run=(mode,fn)=>open().then(db=>new Promise((res,rej)=>{
    const tx=db.transaction('photos',mode),r=fn(tx.objectStore('photos'));
    tx.oncomplete=()=>res(r&&r.result);tx.onerror=tx.onabort=()=>rej(tx.error);
  }));
  return{put:rec=>run('readwrite',s=>s.put(rec)),get:id=>run('readonly',s=>s.get(id)),del:id=>run('readwrite',s=>s.delete(id)),all:()=>run('readonly',s=>s.getAll())};
})();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})}catch(e){}

/* ============ chế độ dùng chung nhiều người (db của trang) ============ */
let CLOUD=false,DB=null,USER=null,ME=null,CID=null,CAN=false,ADMIN=false;const shown={};
async function initCloud(){
  try{
    if(!window.claude)return;
    const [u,d]=await Promise.all([claude.use('user'),claude.use('db')]);
    if(!u||!d)return;
    const id=await u.id();if(!id)return;
    USER=u;DB=d;ME=id;CID=id;CAN=(await u.can('data.write'))!==false;ADMIN=await u.canEdit();CLOUD=true;
  }catch(e){}
}
const ready=initCloud();
const toDataURL=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(b)});
function fromDataURL(u){const i=u.indexOf(','),m=/data:([^;]+)/.exec(u)[1],t=atob(u.slice(i+1)),a=new Uint8Array(t.length);for(let k=0;k<t.length;k++)a[k]=t.charCodeAt(k);return new Blob([a],{type:m})}
const col=()=>DB.collection('photos');
const Store={
  put:async rec=>{if(!CLOUD)return Local.put(rec);
    const data=rec.data||await toDataURL(rec.blob);
    await col().doc(rec.id).set({book:rec.book,name:rec.name,radius:rec.radius,data,t:rec.t,owner:rec.owner||ME})},
  get:async id=>{if(!CLOUD)return Local.get(id);const s=await col().doc(id).get();return s.exists?{id,...s.data()}:null},
  del:id=>CLOUD?col().doc(id).delete():Local.del(id),
  all:()=>Local.all()
};
const canModify=sp=>{const o=sp.userData.owner;return !CLOUD||!o||o===ME||o===CID};

const loadImg=src=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src});
/* thu nhỏ ảnh (tối đa 1600px) để lưu nhẹ hơn */
async function shrink(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await loadImg(url),M=Math.max(img.width,img.height);let last=file;
    for(const [d,q] of (CLOUD?[[1280,.8],[1024,.72],[800,.65],[600,.55],[420,.5]]:[[1600,.88]])){
      const k=Math.min(1,d/M),c=mk(Math.round(img.width*k),Math.round(img.height*k)),x=c.getContext('2d');
      x.fillStyle='#05030f';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
      const bl=await new Promise(r=>c.toBlob(r,'image/jpeg',q));
      if(bl){last=bl;if(!CLOUD||bl.size*1.37<200000)return bl}
    }
    return last;
  }finally{URL.revokeObjectURL(url)}
}
async function addPhoto(blob,name,book,id,radius,fadeIn){
  const url=URL.createObjectURL(blob),img=await loadImg(url);
  const art=c=>{
    c.fillStyle='#05030f';c.fillRect(0,0,AW,AH);
    const s=Math.max(AW/img.width,AH/img.height),w=img.width*s,h=img.height*s;
    c.drawImage(img,(AW-w)/2,(AH-h)/2,w,h);
  };
  const sp=addCard(cardCanvas(art,name,book.theme.title),name,book.theme.title,url,radius,fadeIn,book);
  sp.userData.id=id;sp.userData.art=art;sp.userData.book=book;
  return sp;
}

  const target=cur,files=[...fileIn.files].filter(f=>f.type.startsWith('image/'));
  fileIn.value='';
  let saved=0,failed=0;
  for(const f of files){
    try{
      const blob=await shrink(f),name=f.name.replace(/\.[^.]+$/,'');
      const id=Date.now().toString(36)+Math.random().toString(36).slice(2,7),radius=5+Math.random()*13;
      const sp=await addPhoto(blob,name,target,id,radius,true);
      sp.userData.owner=ME;shown[id]=sp;
      tween(1100,e=>{sp.material.opacity=e;sp.userData.sc=lerp(.1,1,e)},easeOutCubic);
      try{await Store.put({id,book:target.idx,name,radius,blob,t:Date.now(),owner:ME});saved++}catch(e){failed++}
    }catch(e){failed++}
  }
  if(!files.length)return;
  if(failed)note(saved?`Đã lưu ${saved} ảnh · ${failed} ảnh chưa lưu được`:'Ảnh đã thêm nhưng chưa lưu được (trình duyệt không cho phép)');
  else note(`Đã tự lưu ${saved} ảnh`);
});

/* khôi phục ảnh đã lưu khi mở lại */
async function loadSaved(){
  await ready;await Auth.ready;
  ME=Auth.user.key; /* ảnh gắn với tên tài khoản ứng dụng, cả khi lưu cục bộ lẫn trên máy chủ */
  if(!CLOUD){
    try{
      const recs=((await Store.all())||[]).sort((a,b)=>a.t-b.t);
      for(const r of recs){
        if(r.owner&&r.owner!==ME)continue; /* ảnh của tài khoản khác */
        if(!r.owner){r.owner=ME;Local.put(r).catch(()=>{})} /* ảnh cũ chưa có chủ: tài khoản đăng nhập đầu tiên nhận */
        const bk=books[r.book];if(!bk)continue;
        try{await addPhoto(r.blob,r.name,bk,r.id,r.radius||5+Math.random()*13,false)}catch(e){}
      }
    }catch(e){}
    return;
  }
  if(!CAN)document.getElementById('bAdd').style.display='none';
  note(CAN?'Ảnh của bạn được lưu trên máy chủ và đồng bộ giữa các thiết bị':'Bạn chỉ có quyền xem nên chưa thể thêm ảnh');
  col().onSnapshot(async snap=>{
    for(const ch of snap.docChanges()){
      const id=ch.doc.id,d=ch.doc.data()||{},sp=shown[id];
      if(ch.type==='removed'){
        delete shown[id];
        if(sp&&sp!==1){if(lbCur===sp){closeLB();lbCur=null}removeCard(sp)}
      }else if(ch.type==='modified'){
        if(sp&&sp!==1&&d.name&&d.name!==sp.userData.title)applyName(sp,d.name);
      }else if(!sp){
        if(d.owner&&d.owner!==ME&&d.owner!==CID)continue; /* ảnh của tài khoản khác */
        shown[id]=1;
        try{
          const bk=books[d.book];if(!bk||!d.data){delete shown[id];continue}
          const c=await addPhoto(fromDataURL(d.data),d.name||'Ảnh',bk,id,d.radius||5+Math.random()*13,false);
          c.userData.owner=d.owner;shown[id]=c;
        }catch(e){delete shown[id]}
      }
    }
  },()=>note('Mất kết nối với thư viện chung'));
}

/* đặt tên cho ảnh */
const lbT=document.getElementById('lbT'),lbName=document.getElementById('lbName');

/* xóa một ảnh (cả trên màn hình lẫn trong bộ nhớ) */
function removeCard(sp){

/* ============ vòng lặp ============ */
const clock=new THREE.Clock();
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),.05);T+=dt;
  for(let i=tweens.length-1;i>=0;i--){
    const tw=tweens[i];tw.t+=dt*1000;const p=Math.min(tw.t/tw.dur,1);
    tw.fn(tw.ease(p),p);if(p>=1){tweens.splice(i,1);tw.res()}
  }
  books.forEach(b=>{b.portalMat.uniforms.uTime.value+=dt*portalSpeed});

  if(mode==='book'){
    const z=lerp(lerp(fit(rowHW()),fit(1.6),rowT),fit(2.9),bookOpen);
    camera.position.set(0,0,z);look.set(0,0,0);camera.lookAt(look);
    const shelf=bookState==='shelf';
    hoverBook=(shelf&&mouseIn&&ptrs.size===0&&!lb.classList.contains('on'))?bookAt(lastClient.x,lastClient.y):null;
    books.forEach(b=>{
      b.hv+=((b===hoverBook?1:0)-b.hv)*Math.min(1,dt*8);
      const sway=Math.sin(T*.6+b.idx)*.07,bob=Math.sin(T*1.3+b.idx*1.7)*.06;
      if(b===cur&&!shelf){
        b.group.position.y=bob;
        b.group.rotation.y=curYaw+sway*(1-bookOpen);
        b.group.rotation.x=.1*(1-bookOpen)+Math.sin(T*.9)*.012;
      }else{
        b.group.position.y=(bob+b.hv*.35)*b.baseScale;
        b.group.rotation.y=lerp(b.theme.yaw+sway,0,b.hv*.7);
        b.group.rotation.x=.1;
      }
    });
    if(hoverBook){tip.textContent=hoverBook.theme.title;tip.style.opacity=1}else if(shelf)tip.style.opacity=0;
    canvas.style.cursor=hoverBook?'pointer':'default';
    for(let i=0;i<sparkN;i++){let y=sparkPos[i*3+1]+dt*sparkSpd[i];if(y>3)y=-3;sparkPos[i*3+1]=y}
    sparkGeo.attributes.position.needsUpdate=true;
  }
  if(mode==='flying'){
    for(let i=0;i<sparkN;i++){let y=sparkPos[i*3+1]+dt*sparkSpd[i]*4;if(y>3)y=-3;sparkPos[i*3+1]=y}
    sparkGeo.attributes.position.needsUpdate=true;
  }
  if(mode==='galaxy'||mode==='reveal'||mode==='returning'){
    const k=Math.min(1,dt*7);
    if(mode==='galaxy'){
      if(autoRotate&&ptrs.size===0)tgt.theta+=dt*.05;
      sph.theta+=(tgt.theta-sph.theta)*k;sph.phi+=(tgt.phi-sph.phi)*k;sph.r+=(tgt.r-sph.r)*k;
    }
    const s=Math.sin(sph.phi);
    camera.position.set(sph.r*s*Math.sin(sph.theta),sph.r*Math.cos(sph.phi),sph.r*s*Math.cos(sph.theta));
    look.set(0,0,0);camera.lookAt(look);
    galaxy.rotation.y+=dt*.03;
    coreGlow.scale.setScalar(11+Math.sin(T*1.5)*.6);

    if(mode==='galaxy'&&ptrs.size===0&&mouseIn&&!lb.classList.contains('on'))hovered=cardAt(lastClient.x,lastClient.y);
    else if(ptrs.size>0||!mouseIn)hovered=null;
    if(hovered){tip.textContent=hovered.userData.title;tip.style.opacity=1}else tip.style.opacity=0;
    if(mode==='galaxy')canvas.style.cursor=hovered?'pointer':(ptrs.size?'grabbing':'grab');

    cards.forEach(sp=>{
      const u=sp.userData,h=sp===hovered;
      u.v+=((h?0:1)-u.v)*Math.min(1,dt*5);
      u.spinner.rotation.y+=dt*u.speed*u.v;
      u.sc+=((h?1.35:1)-u.sc)*Math.min(1,dt*8);
      sp.scale.set(3.2*u.sc,4*u.sc,1);
      sp.position.y=Math.sin(T*.8+u.ph)*.25;
      u.ring.material.opacity=lerp(u.ring.material.opacity,h?.55:.14,Math.min(1,dt*6));
    });
  }
  renderer.render(scene,camera);
}

function onResize(){
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);layoutBooks();
}
addEventListener('resize',onResize);

loop();
loadSaved();
setTimeout(()=>{showHint('Chọn một cuốn sách để mở');shelfBar.classList.add('on')},700);
})();

  for(let i=0;i<80;i++)tw.push({x:Math.random(),y:Math.random(),p:Math.random()*6.28,s:1+Math.random()*2.4,r:.8+Math.random()*2});
  /* ngôi sao 4 cánh lấp lánh */
  function star(px,py,r,a,col){x.globalAlpha=a;x.fillStyle=col;x.beginPath();x.moveTo(px,py-r);x.quadraticCurveTo(px,py,px+r,py);x.quadraticCurveTo(px,py,px,py+r);x.quadraticCurveTo(px,py,px-r,py);x.quadraticCurveTo(px,py,px,py-r);x.fill();x.globalAlpha=1}
  function spawn(){
    if(ms.length>30)return;
    const a=(18+Math.random()*24)*Math.PI/180,sp=700+Math.random()*500,d=Math.random()<.5?1:-1;
    ms.push({x:d>0?W*(.3+Math.random()*.8):W*(-.1+Math.random()*.8),y:-20+Math.random()*H*.4,vx:-d*Math.cos(a)*sp,vy:Math.sin(a)*sp,
      t:0,life:.8+Math.random()*.7,len:120+Math.random()*120});
  }
  function frame(now){
    requestAnimationFrame(frame);
    const dt=Math.min((now-last)/1000,.05);last=now;
    x.clearRect(0,0,W,H);
    const TT=now/1000;
    for(const t of tw){let a=.5+.5*Math.sin(TT*t.s+t.p);a=a*a*a;if(a>.04)star(t.x*W,t.y*H,t.r*(1+a*2.5),a*.9,'#e6dcff')}
    next-=dt;
    if(next<=0){spawn();if(Math.random()<.9)setTimeout(spawn,80+Math.random()*250);if(Math.random()<.7)setTimeout(spawn,250+Math.random()*400);if(Math.random()<.5)setTimeout(spawn,500+Math.random()*500);if(Math.random()<.3)setTimeout(spawn,800+Math.random()*600);next=.12+Math.random()*.4}
    for(let i=ms.length-1;i>=0;i--){
      const m=ms[i];m.t+=dt;m.x+=m.vx*dt;m.y+=m.vy*dt;
      if(m.t>=m.life){ms.splice(i,1);continue}
      const al=Math.sin(Math.PI*m.t/m.life),sp=Math.hypot(m.vx,m.vy),tx=m.x-m.vx/sp*m.len,ty=m.y-m.vy/sp*m.len;
      const g=x.createLinearGradient(m.x,m.y,tx,ty);
      g.addColorStop(0,'rgba(255,255,255,'+al+')');g.addColorStop(.35,'rgba(190,170,255,'+al*.5+')');g.addColorStop(1,'rgba(120,90,255,0)');
      x.strokeStyle=g;x.lineWidth=1.8;x.lineCap='round';x.beginPath();x.moveTo(m.x,m.y);x.lineTo(tx,ty);x.stroke();
      if(ps.length<500)for(let k=0;k<2;k++){const f=Math.random()*m.len*.7;ps.push({x:m.x-m.vx/sp*f,y:m.y-m.vy/sp*f,vx:(Math.random()-.5)*40,vy:(Math.random()-.5)*40+15,t:0,life:.5+Math.random()*.8,r:1.5+Math.random()*2.5,p:Math.random()*6.28,c:['#ffffff','#cdb8ff','#ffe9a8'][k+(Math.random()<.4?1:0)]||'#fff'})}
      x.save();x.shadowBlur=14;x.shadowColor='#cdb8ff';x.fillStyle='rgba(255,255,255,'+al+')';
      x.beginPath();x.arc(m.x,m.y,2,0,6.2832);x.fill();x.restore();
    }
    for(let i=ps.length-1;i>=0;i--){
      const p=ps[i];p.t+=dt;if(p.t>=p.life){ps.splice(i,1);continue}
      p.x+=p.vx*dt;p.y+=p.vy*dt;
      const k=1-p.t/p.life,a=k*(.55+.45*Math.sin(p.t*30+p.p));
      if(a>.03)star(p.x,p.y,p.r*(.5+k),a,p.c);
    }
  }
  requestAnimationFrame(frame);
})();
</script>
